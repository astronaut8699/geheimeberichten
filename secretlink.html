
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secret Link 2.0</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090f19;color:#ecfff6;
  font-family:Arial,sans-serif
}
main{max-width:720px;margin:auto;padding:20px}
h1{text-align:center;color:#37ec9d}
.panel{
  background:#152332;border:1px solid #315b51;
  padding:20px;border-radius:16px;margin:15px 0
}
input,textarea,button{
  width:100%;padding:13px;margin:7px 0;
  border-radius:9px;font:inherit
}
input,textarea{
  background:#091521;color:white;
  border:1px solid #42685f
}
button{
  border:0;background:#30dc92;
  color:#062719;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.5;cursor:not-allowed}
.secondary{background:#344d60;color:white}
#chat{
  height:350px;overflow-y:auto;
  background:#091521;padding:12px;
  border-radius:12px
}
.msg{
  padding:12px;margin:10px 0;
  background:#244056;border-radius:12px;
  overflow-wrap:anywhere;white-space:pre-wrap
}
.mine{background:#15573f}
.meta{font-size:12px;color:#c2d6d1;margin-bottom:5px}
#status{color:#42edaa}
small{color:#b1c9c0}
</style>
</head>
<body>
<main>
<h1>🔐 SECRET LINK</h1>
<p style="text-align:center">Encrypted online messenger</p>

<section class="panel">
  <h2>Geheime kamer</h2>
  <button id="create">+ Nieuwe kamer maken</button>
  <input id="room" placeholder="Kamercode">
  <input id="password" type="password"
         placeholder="Geheim wachtwoord (min. 12 tekens)">
  <input id="username" maxlength="30"
         placeholder="Jouw naam">
  <button id="join">Verbinden</button>
  <button id="share" class="secondary">
    Uitnodigingslink kopiëren
  </button>
  <p id="status">Nog niet verbonden</p>
</section>

<section class="panel">
  <h2>💬 Berichten</h2>
  <div id="chat"></div>
  <textarea id="message" rows="3" maxlength="1500"
    placeholder="Typ je geheime bericht..."></textarea>
  <button id="send" disabled>
    🔒 Versleutelen en versturen
  </button>
  <small>
    Alleen mensen met het juiste wachtwoord
    kunnen de inhoud lezen.
  </small>
</section>

<script>
const $ = id => document.getElementById(id);
const enc = new TextEncoder();
const dec = new TextDecoder("utf-8",{fatal:true});

let source = null;
let room = "";
let password = "";
let myName = "";
let myId = "";
let seen = new Set();

function status(text){
  $("status").textContent = text;
}

function randomHex(n){
  return Array.from(
    crypto.getRandomValues(new Uint8Array(n)),
    b => b.toString(16).padStart(2,"0")
  ).join("");
}

function to64(bytes){
  let s = "";
  for(const b of bytes) s += String.fromCharCode(b);
  return btoa(s);
}

function from64(s){
  return Uint8Array.from(atob(s),c=>c.charCodeAt(0));
}

async function keyFromPassword(pass,salt){
  const base = await crypto.subtle.importKey(
    "raw",enc.encode(pass),
    "PBKDF2",false,["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    {
      name:"PBKDF2",salt,
      iterations:250000,hash:"SHA-256"
    },
    base,
    {name:"AES-GCM",length:256},
    false,["encrypt","decrypt"]
  );
}

async function encryptMessage(text){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await keyFromPassword(password,salt);
  const ciphertext=await crypto.subtle.encrypt(
    {name:"AES-GCM",iv},key,enc.encode(text)
  );
  return JSON.stringify({
    v:1,
    s:to64(salt),
    i:to64(iv),
    c:to64(new Uint8Array(ciphertext))
  });
}

async function decryptMessage(payload){
  const p=JSON.parse(payload);
  if(p.v!==1) throw Error("Ongeldig formaat");
  const salt=from64(p.s),iv=from64(p.i);
  if(salt.length!==16||iv.length!==12)
    throw Error("Ongeldige code");
  const key=await keyFromPassword(password,salt);
  return dec.decode(await crypto.subtle.decrypt(
    {name:"AES-GCM",iv},key,from64(p.c)
  ));
}

function addMessage(name,text,mine,time){
  const div=document.createElement("div");
  div.className="msg"+(mine?" mine":"");
  const meta=document.createElement("div");
  meta.className="meta";
  meta.textContent=name+" • "+time;
  const body=document.createElement("div");
  body.textContent=text;
  div.append(meta,body);
  $("chat").append(div);
  $("chat").scrollTop=$("chat").scrollHeight;
}

$("create").onclick=()=>{
  $("room").value=randomHex(16);
  status("Nieuwe kamer gemaakt. Kies een wachtwoord.");
};

$("share").onclick=async()=>{
  const code=$("room").value.trim().toLowerCase();
  if(!/^[a-f0-9]{32}$/.test(code)){
    status("Maak eerst een geldige kamer.");
    return;
  }
  const url=location.href.split("#")[0]+"#"+code;
  try{
    await navigator.clipboard.writeText(url);
    status("Uitnodigingslink gekopieerd!");
  }catch{
    status("Kopiëren mislukt. Kopieer de URL handmatig.");
  }
};

$("join").onclick=()=>{
  const code=$("room").value.trim().toLowerCase();
  const pass=$("password").value;
  const name=$("username").value.trim();

  if(!/^[a-f0-9]{32}$/.test(code)){
    status("Ongeldige kamercode.");
    return;
  }
  if(pass.length<12){
    status("Gebruik minimaal 12 tekens.");
    return;
  }
  if(!name){
    status("Vul je naam in.");
    return;
  }
  if(!crypto.subtle){
    status("Open deze website via HTTPS.");
    return;
  }

  if(source) source.close();
  room=code;
  password=pass;
  myName=name;
  myId=randomHex(12);
  seen.clear();
  $("chat").replaceChildren();
  $("send").disabled=false;
  location.hash=room;

  status("Verbinding maken...");

  const topic="secretlink-"+room;
  const url="https://ntfy.sh/"+topic+
            "/sse?since=all";

  source=new EventSource(url);

  source.onopen=()=>{
    status("🟢 Verbonden");
  };

  source.onerror=()=>{
    status("Verbinding onderbroken. Opnieuw verbinden...");
  };

  source.onmessage=async event=>{
    try{
      const incoming=JSON.parse(event.data);
      if(incoming.event!=="message") return;
      if(seen.has(incoming.id)) return;
      seen.add(incoming.id);

      // Houd de lijst klein.
      if(seen.size>1000) seen.clear();

      const plain=await decryptMessage(incoming.message);
      const msg=JSON.parse(plain);

      if(typeof msg.text!=="string" ||
         typeof msg.name!=="string") return;

      const time=new Date(
        incoming.time*1000
      ).toLocaleTimeString("nl-NL",{
        hour:"2-digit",minute:"2-digit"
      });

      addMessage(
        msg.name,
        msg.text,
        msg.sender===myId,
        time
      );
    }catch(e){
      console.warn("Bericht niet leesbaar:",e);
    }
  };
};

$("send").onclick=async()=>{
  const text=$("message").value.trim();
  if(!room||!text) return;

  $("send").disabled=true;
  status("Bericht versleutelen...");

  try{
    const payload=await encryptMessage(JSON.stringify({
      name:myName,
      sender:myId,
      text:text
    }));

    const response=await fetch(
      "https://ntfy.sh/secretlink-"+room,
      {
        method:"POST",
        body:payload
      }
    );

    if(!response.ok){
      throw Error("Serverfout "+response.status);
    }

    $("message").value="";
    status("🟢 Bericht verstuurd");
  }catch(e){
    status("Versturen mislukt: "+e.message);
  }finally{
    $("send").disabled=false;
  }
};

if(/^#[a-f0-9]{32}$/i.test(location.hash)){
  $("room").value=location.hash.slice(1);
}
</script>
</main>
</body>
</html>
